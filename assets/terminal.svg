<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 772" width="860" height="772" role="img" aria-label="Terminal: friday hello. Jose, self-taught developer, born in Portugal, now in Irvine, Scotland. Story, stack and work listing.">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #f0f0f0 } .mut { fill: #808080 } .dim { fill: #3a3a3a }
    /* No base opacity:0 — if a renderer drops animation, the whole terminal still reads. */
    .ln   { animation: fade .3s cubic-bezier(.16,1,.3,1) both }
    .wipe { animation: type .55s steps(22) both }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes type { from { width: 0 } to { width: 860px } }
    @keyframes blink { 0%,45% { opacity: 1 } 50%,100% { opacity: 0 } }
    .w1 { animation-delay: .25s } .w2 { animation-delay: 1.40s } .w3 { animation-delay: 3.00s }
    .w4 { animation-delay: 4.10s } .w5 { animation-delay: 5.40s }
    .b1 { animation-delay: .80s } .b2 { animation-delay: .90s } .b3 { animation-delay: 1.00s }
    .s1 { animation-delay: 1.95s } .s2 { animation-delay: 2.08s } .s3 { animation-delay: 2.21s }
    .s4 { animation-delay: 2.34s } .s5 { animation-delay: 2.52s } .s6 { animation-delay: 2.65s }
    .m1 { animation-delay: 3.50s } .m2 { animation-delay: 3.62s } .m3 { animation-delay: 3.74s }
    .k1 { animation-delay: 4.60s } .k2 { animation-delay: 4.70s } .k3 { animation-delay: 4.80s }
    .k4 { animation-delay: 4.90s } .k5 { animation-delay: 5.00s }
    .l1 { animation-delay: 5.90s } .l2 { animation-delay: 6.10s }
    .cur { animation: blink 1.1s steps(1) 6.35s infinite }
  </style>

  <clipPath id="p1"><rect class="wipe w1" x="0" y="48"  width="860" height="26"/></clipPath>
  <clipPath id="p2"><rect class="wipe w2" x="0" y="184" width="860" height="26"/></clipPath>
  <clipPath id="p3"><rect class="wipe w3" x="0" y="364" width="860" height="26"/></clipPath>
  <clipPath id="p4"><rect class="wipe w4" x="0" y="474" width="860" height="26"/></clipPath>
  <clipPath id="p5"><rect class="wipe w5" x="0" y="632" width="860" height="26"/></clipPath>

  <!-- window -->
  <rect x="1" y="1" width="858" height="770" rx="14" fill="#0d0d0d" stroke="#1e1e1e"/>
  <path d="M1 30 h858" stroke="#1e1e1e"/>
  <g fill="#2a2a2a"><circle cx="24" cy="15.5" r="4.5"/><circle cx="42" cy="15.5" r="4.5"/><circle cx="60" cy="15.5" r="4.5"/></g>
  <text class="mono mut" x="430" y="20" font-size="11.5" text-anchor="middle" letter-spacing=".4">friday-developer — zsh</text>
  <text class="mono mut" x="836" y="20" font-size="11.5" text-anchor="end" letter-spacing="-.2">&lt;f/&gt;</text>

  <!-- $ friday hello -->
  <g clip-path="url(#p1)">
    <text class="mono" x="32" y="66" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday hello</tspan></text>
  </g>

  <!-- ASCII <f/> wordmark + identity -->
  <g class="mono ink" font-size="13.5" xml:space="preserve">
    <text class="ln b1" x="36" y="102">  __   __      __ __</text>
    <text class="ln b1" x="36" y="119"> / /  / _|    / / \ \</text>
    <text class="ln b2" x="36" y="136">/ /  | |_    / /   \ \</text>
    <text class="ln b2" x="36" y="153">\ \  |  _|  / /    / /</text>
    <text class="ln b3" x="36" y="170"> \_\ |_|   /_/    /_/</text>
  </g>
  <g class="mono" font-size="14">
    <text class="ink ln b2" x="266" y="119">José <tspan class="dim">—</tspan> <tspan class="mut">self-taught developer, solo traveller</tspan></text>
    <text class="mut ln b3" x="266" y="142">Irvine, Scotland <tspan class="dim">·</tspan> Telcabo Group <tspan class="dim">·</tspan> fridaydeveloper.com</text>
  </g>

  <!-- $ cat story.txt -->
  <g clip-path="url(#p2)">
    <text class="mono" x="32" y="202" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">cat story.txt</tspan></text>
  </g>
  <g class="mono ink" font-size="14.5">
    <text class="ln s1" x="36" y="232">No degree. I've been learning this since I was a kid, because I kept</text>
    <text class="ln s2" x="36" y="254">having ideas and wanted to see them exist outside my head. Code was</text>
    <text class="ln s3" x="36" y="276">the best way I found to do that, and it still is.</text>
    <text class="ln s4" x="36" y="306">I travel alone by choice and I chase problems for a living. Both come</text>
    <text class="ln s5" x="36" y="328">down to the same thing: find the way through.</text>
    <text class="mut ln s6" x="36" y="358">Someday I'll build something people recognise by name. For now it's me,</text>
  </g>
  <text class="mono mut ln s6" x="36" y="380" font-size="14.5">my dreams and the technology — which has been enough so far.</text>

  <!-- $ friday whereami -->
  <g clip-path="url(#p3)">
    <text class="mono" x="32" y="414" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday whereami</tspan></text>
  </g>
  <g class="mono" font-size="13.5">
    <g class="ln m1"><text class="mut" x="36" y="444">born</text><text class="ink" x="146" y="444">Portugal</text></g>
    <g class="ln m2"><text class="mut" x="36" y="468">lived</text><text class="ink" x="146" y="468">France <tspan class="dim">→</tspan> Ireland <tspan class="dim">→</tspan> Scotland</text></g>
    <g class="ln m3"><text class="mut" x="36" y="492">now</text><text class="ink" x="146" y="492">Irvine, Scotland <tspan class="dim">·</tspan> <tspan class="mut">next one undecided, that's the point</tspan></text></g>
  </g>

  <!-- $ friday stack -->
  <g clip-path="url(#p4)">
    <text class="mono" x="32" y="528" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday stack</tspan></text>
  </g>
  <g class="mono" font-size="13.5">
    <g class="ln k1"><text class="mut" x="36" y="558">web</text><text class="ink" x="146" y="558">TypeScript <tspan class="dim">·</tspan> Next.js <tspan class="dim">·</tspan> React 19 <tspan class="dim">·</tspan> Tailwind v4 <tspan class="dim">·</tspan> shadcn/ui</text></g>
    <g class="ln k2"><text class="mut" x="36" y="582">mobile</text><text class="ink" x="146" y="582">React Native <tspan class="dim">·</tspan> Expo SDK 54 <tspan class="dim">·</tspan> Reanimated <tspan class="dim">·</tspan> Bluetooth LE</text></g>
    <g class="ln k3"><text class="mut" x="36" y="606">desktop</text><text class="ink" x="146" y="606">Electron 43 <tspan class="dim">·</tspan> node-pty <tspan class="dim">·</tspan> xterm.js <tspan class="dim">·</tspan> node:sqlite</text></g>
    <g class="ln k4"><text class="mut" x="36" y="630">server</text><text class="ink" x="146" y="630">PHP 8.4 <tspan class="dim">·</tspan> PostgreSQL + PostGIS <tspan class="dim">·</tspan> MySQL <tspan class="dim">·</tspan> raw PDO, no ORM</text></g>
    <g class="ln k5"><text class="mut" x="36" y="654">infra</text><text class="ink" x="146" y="654">Debian <tspan class="dim">·</tspan> Incus <tspan class="dim">·</tspan> nginx <tspan class="dim">·</tspan> Tailscale <tspan class="dim">·</tspan> Cloudflare <tspan class="dim">·</tspan> GH Actions</text></g>
  </g>

  <!-- $ ls work/ -->
  <g clip-path="url(#p5)">
    <text class="mono" x="32" y="690" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">ls work/</tspan></text>
  </g>
  <g class="mono" font-size="14">
    <text class="ink ln l1" x="36" y="720">atlas/<tspan dx="34">airfellow/</tspan><tspan dx="34">foral/</tspan><tspan dx="34">reeve/</tspan></text>
    <text class="mut ln l2" x="36" y="744" font-size="13">→ 4 shipped. the screens, the write-ups and the hard parts are on the site.</text>
  </g>

  <text class="mono ink cur" x="620" y="744" font-size="15">▌</text>
</svg>
