<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 532" width="860" height="532" role="img" aria-label="Terminal: friday hello. Jose, self-taught developer and solo traveller, born in Portugal, now in Scotland.">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #f0f0f0 } .mut { fill: #808080 } .dim { fill: #3a3a3a }
    /* No base opacity:0 — if a renderer drops animation, the whole terminal still reads. */
    .ln   { animation: fade .3s cubic-bezier(.16,1,.3,1) both }
    .wipe { animation: type .55s steps(22) both }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes type { from { width: 0 } to { width: 860px } }
    @keyframes blink { 0%,45% { opacity: 1 } 50%,100% { opacity: 0 } }
    .w1 { animation-delay: .25s } .w2 { animation-delay: 1.40s } .w3 { animation-delay: 3.00s }
    .b1 { animation-delay: .80s } .b2 { animation-delay: .90s } .b3 { animation-delay: 1.00s }
    .s1 { animation-delay: 1.95s } .s2 { animation-delay: 2.08s } .s3 { animation-delay: 2.21s }
    .s4 { animation-delay: 2.34s } .s5 { animation-delay: 2.52s } .s6 { animation-delay: 2.65s }
    .m1 { animation-delay: 3.50s } .m2 { animation-delay: 3.64s }
    .cur { animation: blink 1.1s steps(1) 3.95s infinite }
  </style>

  <clipPath id="p1"><rect class="wipe w1" x="0" y="48"  width="860" height="26"/></clipPath>
  <clipPath id="p2"><rect class="wipe w2" x="0" y="184" width="860" height="26"/></clipPath>
  <clipPath id="p3"><rect class="wipe w3" x="0" y="398" width="860" height="26"/></clipPath>

  <!-- window -->
  <rect x="1" y="1" width="858" height="530" rx="14" fill="#0d0d0d" stroke="#1e1e1e"/>
  <path d="M1 30 h858" stroke="#1e1e1e"/>
  <g fill="#2a2a2a"><circle cx="24" cy="15.5" r="4.5"/><circle cx="42" cy="15.5" r="4.5"/><circle cx="60" cy="15.5" r="4.5"/></g>
  <text class="mono mut" x="430" y="20" font-size="11.5" text-anchor="middle" letter-spacing=".4">friday-developer — zsh</text>
  <text class="mono mut" x="836" y="20" font-size="11.5" text-anchor="end" letter-spacing="-.2">&lt;f/&gt;</text>

  <!-- $ friday hello -->
  <g clip-path="url(#p1)">
    <text class="mono" x="32" y="66" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday hello</tspan></text>
  </g>

  <!-- ASCII <f/> wordmark + identity -->
  <g class="mono ink" font-size="13.5" xml:space="preserve">
    <text class="ln b1" x="36" y="102">  __   __      __ __</text>
    <text class="ln b1" x="36" y="119"> / /  / _|    / / \ \</text>
    <text class="ln b2" x="36" y="136">/ /  | |_    / /   \ \</text>
    <text class="ln b2" x="36" y="153">\ \  |  _|  / /    / /</text>
    <text class="ln b3" x="36" y="170"> \_\ |_|   /_/    /_/</text>
  </g>
  <g class="mono" font-size="14">
    <text class="ink ln b2" x="266" y="119">José <tspan class="dim">—</tspan> <tspan class="mut">self-taught developer, solo traveller</tspan></text>
    <text class="mut ln b3" x="266" y="142">Scotland <tspan class="dim">·</tspan> Telcabo Group <tspan class="dim">·</tspan> fridaydeveloper.com</text>
  </g>

  <!-- $ cat story.txt -->
  <g clip-path="url(#p2)">
    <text class="mono" x="32" y="202" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">cat story.txt</tspan></text>
  </g>
  <g class="mono ink" font-size="14.5">
    <text class="ln s1" x="36" y="232">No degree. I've been learning this since I was a kid, because I kept</text>
    <text class="ln s2" x="36" y="254">having ideas and wanted to see them exist outside my head. Code was</text>
    <text class="ln s3" x="36" y="276">the best way I found to do that, and it still is.</text>
    <text class="ln s4" x="36" y="306">I travel alone by choice and I chase problems for a living. Both come</text>
    <text class="ln s5" x="36" y="328">down to the same thing: find the way through.</text>
    <text class="mut ln s6" x="36" y="358">Someday I'll build something people recognise by name. For now it's me,</text>
    <text class="mut ln s6" x="36" y="380">my dreams and the technology — which has been enough so far.</text>
  </g>

  <!-- $ friday whereami -->
  <g clip-path="url(#p3)">
    <text class="mono" x="32" y="416" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday whereami</tspan></text>
  </g>
  <g class="mono" font-size="13.5">
    <g class="ln m1"><text class="mut" x="36" y="446">born</text><text class="ink" x="146" y="446">Portugal</text></g>
    <g class="ln m2"><text class="mut" x="36" y="470">now</text><text class="ink" x="146" y="470">Scotland <tspan class="dim">·</tspan> <tspan class="mut">next one undecided, that's the point</tspan></text></g>
  </g>

  <text class="mono ink cur" x="36" y="500" font-size="15">▌</text>
</svg>
