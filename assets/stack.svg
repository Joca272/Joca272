<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Terminal: friday stack — web, mobile, desktop, server, infra.">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink  { fill: #f0f0f0 }
    .mut  { fill: #808080 }
    .dot  { fill: #3a3a3a }
    .ln   { animation: fade .3s cubic-bezier(.16,1,.3,1) both }
    .wipe { animation: type .55s steps(20) both }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes type { from { width: 0 } to { width: 860px } }
    .r1 { animation-delay: .75s } .r2 { animation-delay: .90s } .r3 { animation-delay: 1.05s }
    .r4 { animation-delay: 1.20s } .r5 { animation-delay: 1.35s }
  </style>

  <clipPath id="s1"><rect class="wipe" x="0" y="46" width="860" height="34" /></clipPath>

  <rect x="1" y="1" width="858" height="328" rx="14" fill="#0d0d0d" stroke="#1e1e1e" />
  <path d="M1 30 h858" stroke="#1e1e1e" />
  <g fill="#2a2a2a"><circle cx="24" cy="15.5" r="4.5"/><circle cx="42" cy="15.5" r="4.5"/><circle cx="60" cy="15.5" r="4.5"/></g>
  <text class="mono mut" x="430" y="20" font-size="11.5" text-anchor="middle" letter-spacing=".4">friday-developer — stack</text>
  <text class="mono mut" x="836" y="20" font-size="11.5" text-anchor="end" letter-spacing="-.2">&lt;f/&gt;</text>

  <g clip-path="url(#s1)">
    <text class="mono" x="28" y="66" font-size="15"><tspan class="mut">$</tspan><tspan class="ink" dx="9">friday stack</tspan></text>
  </g>

  <g class="ln r1">
    <text class="mono mut" x="28"  y="106" font-size="10.5" letter-spacing="1.4">WEB</text>
    <text class="mono ink" x="148" y="106" font-size="13.5">TypeScript <tspan class="dot">·</tspan> Next.js <tspan class="dot">·</tspan> React 19 <tspan class="dot">·</tspan> Tailwind v4 <tspan class="dot">·</tspan> shadcn/ui <tspan class="dot">·</tspan> hand-rolled CSS</text>
  </g>
  <g class="ln r2">
    <text class="mono mut" x="28"  y="150" font-size="10.5" letter-spacing="1.4">MOBILE</text>
    <text class="mono ink" x="148" y="150" font-size="13.5">React Native <tspan class="dot">·</tspan> Expo SDK 54 <tspan class="dot">·</tspan> expo-router <tspan class="dot">·</tspan> Reanimated <tspan class="dot">·</tspan> Bluetooth LE</text>
  </g>
  <g class="ln r3">
    <text class="mono mut" x="28"  y="194" font-size="10.5" letter-spacing="1.4">DESKTOP</text>
    <text class="mono ink" x="148" y="194" font-size="13.5">Electron 43 <tspan class="dot">·</tspan> node-pty <tspan class="dot">·</tspan> xterm.js <tspan class="dot">·</tspan> dockview <tspan class="dot">·</tspan> node:sqlite</text>
  </g>
  <g class="ln r4">
    <text class="mono mut" x="28"  y="238" font-size="10.5" letter-spacing="1.4">SERVER</text>
    <text class="mono ink" x="148" y="238" font-size="13.5">PHP 8.4 <tspan class="dot">·</tspan> PostgreSQL + PostGIS <tspan class="dot">·</tspan> MySQL <tspan class="dot">·</tspan> Drizzle <tspan class="dot">·</tspan> raw PDO, no ORM</text>
  </g>
  <g class="ln r5">
    <text class="mono mut" x="28"  y="282" font-size="10.5" letter-spacing="1.4">INFRA</text>
    <text class="mono ink" x="148" y="282" font-size="13.5">Debian <tspan class="dot">·</tspan> Incus <tspan class="dot">·</tspan> nginx <tspan class="dot">·</tspan> Docker <tspan class="dot">·</tspan> Tailscale <tspan class="dot">·</tspan> Cloudflare <tspan class="dot">·</tspan> GH Actions</text>
  </g>

  <text class="mono mut ln r5" x="28" y="314" font-size="12.5">5 groups · the newest project and the oldest share almost nothing but the keyboard</text>
</svg>
